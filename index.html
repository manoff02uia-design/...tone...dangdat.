<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 20% 30%,#0d0d1a,#03030a);padding:20px}
.card{max-width:480px;width:100%;background:rgba(20,22,40,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:48px;padding:40px 30px;box-shadow:0 30px 60px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.04) inset;text-align:center;transition:transform .25s ease;border:1px solid rgba(255,255,255,0.03);position:relative}
.card:hover{transform:scale(1.01)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.eye-btn,.lang-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(200,190,255,0.7);padding:6px 14px;border-radius:30px;font-size:18px;cursor:pointer;transition:.2s;line-height:1}
.eye-btn:hover,.lang-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
.icon-box{width:96px;height:96px;margin:0 auto 20px;background:linear-gradient(145deg,#ff6b9d,#c44dff,#6f8cff);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 16px 32px rgba(196,77,255,0.35)}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(to right,#fff,#c8b6ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px}
.file-block{background:rgba(0,0,0,0.35);border-radius:20px;padding:18px 16px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04)}
.file-block .label{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:rgba(160,150,220,0.6)}
.file-block .name{font-size:20px;font-weight:600;color:#f0ecff;margin-top:4px;word-break:break-all}
.file-block .size{font-size:13px;color:rgba(180,170,230,0.5);margin-top:6px}
.btn-download{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:18px 24px;background:linear-gradient(135deg,#7c5cfc,#b45aff);border:none;border-radius:40px;font-size:20px;font-weight:600;color:#fff;text-decoration:none;box-shadow:0 12px 28px rgba(124,92,252,0.45);transition:all .2s ease;letter-spacing:.3px}
.btn-download:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(124,92,252,0.65);background:linear-gradient(135deg,#8f6eff,#c76aff)}
.btn-download:active{transform:scale(.96)}
.btn-copy{margin-top:12px;display:inline-block;background:rgba(255,255,255,0.04);padding:12px 18px;border-radius:40px;color:rgba(200,190,255,0.5);font-size:14px;border:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:.2s;width:100%;text-align:center}
.btn-copy:hover{background:rgba(255,255,255,0.08);color:#b8acff}
.extra-section{margin-top:24px;padding-top:20px;border-top:1px dashed rgba(255,255,255,0.08)}
.like-area{margin-top:24px;display:flex;justify-content:center;align-items:center;gap:12px}
.like-btn{background:none;border:none;font-size:32px;cursor:pointer;transition:.2s;color:rgba(255,255,255,0.3)}
.like-btn.liked{color:#ff4757}
.like-btn:hover{transform:scale(1.15)}
.like-count{color:rgba(200,190,255,0.6);font-size:18px;font-weight:500}
.eye-popup{display:none;position:absolute;top:70px;left:20px;right:20px;background:rgba(10,10,20,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 20px;text-align:left;color:#c8b6ff;font-size:14px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,0.6);z-index:10}
.eye-popup.show{display:block}
.eye-popup .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.eye-popup .row:last-child{border-bottom:none}
.eye-popup .label{color:rgba(160,150,220,0.5)}
.eye-popup .value{color:#f0ecff;font-weight:500}
@media(max-width:420px){.card{padding:28px 18px;border-radius:32px}h1{font-size:26px}.btn-download{font-size:17px;padding:15px 20px}}
</style>
</head>
<body>
<div class="card">
<div class="top-bar">
<button class="eye-btn" id="eyeBtn">👁️</button>
<button class="lang-btn" id="langBtn">English</button>
</div>
<div class="eye-popup" id="eyePopup">
<div class="row"><span class="label" id="passLabel">🔑 Mật khẩu</span><span class="value" id="passValue">modskin2026</span></div>
<div class="row"><span class="label" id="viewLabel">👁️ Lượt xem</span><span class="value" id="viewCount">0</span></div>
</div>
<div class="icon-box">🎮</div>
<h1 id="title">MODSKIN</h1>
<div class="file-block">
<div class="label" id="label1">📦 Tên gói</div>
<div class="name" id="name1">MODSKIN</div>
<div class="size" id="size1">🔗 MediaFire · ZIP</div>
</div>
<a href="https://www.mediafire.com/file/3ewb4rriu012zfh/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7%25282%2529.zip/file" class="btn-download" id="btn1" target="_blank" rel="noopener noreferrer">⬇️ Tải xuống ngay</a>
<div class="btn-copy" id="copy1">📋 Sao chép đường dẫn tải</div>
<div class="extra-section">
<div class="file-block">
<div class="label" id="label2">📦 Tên gói</div>
<div class="name" id="name2">FAKE LAG</div>
<div class="size" id="size2">🔗 MediaFire · ZIP</div>
</div>
<a href="https://www.mediafire.com/file/6fm6tz5iar3dy4t/GHOST_MODS_V4_APK_MAIN_ID_SAFE_.apk/file" class="btn-download" id="btn2" target="_blank" rel="noopener noreferrer" style="background:linear-gradient(135deg,#4a3f7a,#6a4f9a);box-shadow:0 12px 28px rgba(74,63,122,0.45)">⬇️ Tải xuống ngay</a>
<div class="btn-copy" id="copy2">📋 Sao chép đường dẫn tải</div>
</div>
<div class="like-area">
<button class="like-btn" id="likeBtn">❤️</button>
<span class="like-count" id="likeCount">0</span>
</div>
</div>
<script>
(function(){
var langData={
label1:{vi:'📦 Tên gói',en:'📦 Package name'},
name1:{vi:'MODSKIN',en:'MODSKIN'},
size1:{vi:'🔗 MediaFire · ZIP',en:'🔗 MediaFire · ZIP'},
btn1:{vi:'⬇️ Tải xuống ngay',en:'⬇️ Download now'},
copy1:{vi:'📋 Sao chép đường dẫn tải',en:'📋 Copy download link'},
label2:{vi:'📦 Tên gói',en:'📦 Package name'},
name2:{vi:'FAKE LAG',en:'FAKE LAG'},
size2:{vi:'🔗 MediaFire · ZIP',en:'🔗 MediaFire · ZIP'},
btn2:{vi:'⬇️ Tải xuống ngay',en:'⬇️ Download now'},
copy2:{vi:'📋 Sao chép đường dẫn tải',en:'📋 Copy download link'},
toggle:{vi:'English',en:'Tiếng Việt'},
passLabel:{vi:'🔑 Mật khẩu',en:'🔑 Password'},
viewLabel:{vi:'👁️ Lượt xem',en:'👁️ Views'},
prompt:{vi:'🔐 Nhập mật khẩu để xem:',en:'🔐 Enter password to view:'},
wrong:{vi:'❌ Mật khẩu sai!',en:'❌ Wrong password!'}
};
var el={
label1:document.getElementById('label1'),
name1:document.getElementById('name1'),
size1:document.getElementById('size1'),
btn1:document.getElementById('btn1'),
copy1:document.getElementById('copy1'),
label2:document.getElementById('label2'),
name2:document.getElementById('name2'),
size2:document.getElementById('size2'),
btn2:document.getElementById('btn2'),
copy2:document.getElementById('copy2'),
langBtn:document.getElementById('langBtn'),
passLabel:document.getElementById('passLabel'),
viewLabel:document.getElementById('viewLabel')
};
var currentLang='vi';
function setLanguage(lang){
currentLang=lang;
for(var key in langData){
if(key==='toggle'||key==='prompt'||key==='wrong')continue;
if(el[key])el[key].innerText=langData[key][lang];
}
el.langBtn.innerText=langData.toggle[lang];
}
el.langBtn.addEventListener('click',function(){
setLanguage(currentLang==='vi'?'en':'vi');
});
setLanguage('vi');
var eyeBtn=document.getElementById('eyeBtn');
var eyePopup=document.getElementById('eyePopup');
eyeBtn.addEventListener('click',function(){
if(eyePopup.classList.contains('show')){
eyePopup.classList.remove('show');
return;
}
var input=prompt(langData.prompt[currentLang]);
if(input===null)return;
if(input==='dangdat'||input==='tone'){
eyePopup.classList.add('show');
}else{
alert(langData.wrong[currentLang]);
}
});
document.addEventListener('click',function(e){
if(!eyeBtn.contains(e.target)&&!eyePopup.contains(e.target)){
eyePopup.classList.remove('show');
}
});
var views=parseInt(localStorage.getItem('modskin_views'))||0;
views++;
localStorage.setItem('modskin_views',views);
document.getElementById('viewCount').innerText=views;
var likeBtn=document.getElementById('likeBtn');
var likeCount=document.getElementById('likeCount');
var likes=parseInt(localStorage.getItem('modskin_likes'))||0;
likeCount.innerText=likes;
likeBtn.addEventListener('click',function(){
likes++;
localStorage.setItem('modskin_likes',likes);
likeCount.innerText=likes;
likeBtn.classList.add('liked');
likeBtn.style.color='#ff4757';
});
function copyText(text,btn){
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(function(){
showCopied(btn);
}).catch(function(){fallback(text,btn);});
}else{fallback(text,btn);}
}
function fallback(text,btn){
var e=document.createElement('input');
e.value=text;
document.body.appendChild(e);
e.select();
try{
document.execCommand('copy');
showCopied(btn);
}catch(x){alert('Sao chép thủ công');}
document.body.removeChild(e);
}
function showCopied(btn){
var old=btn.innerText;
btn.innerText='✅ Đã sao chép!';
btn.style.color='#a78aff';
setTimeout(function(){
btn.innerText=old;
btn.style.color='';
},2000);
}
var url1='https://www.mediafire.com/file/3ewb4rriu012zfh/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7%25282%2529.zip/file';
var url2='https://www.mediafire.com/file/6fm6tz5iar3dy4t/GHOST_MODS_V4_APK_MAIN_ID_SAFE_.apk/file';
document.getElementById('copy1').addEventListener('click',function(){copyText(url1,this);});
document.getElementById('copy2').addEventListener('click',function(){copyText(url2,this);});
})();
</script>
</body>
</html>
