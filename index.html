    <style>
        * {

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;

        .card {
            max-width: 480px;

            background: linear-gradient(to right, #ffffff, #c8b6ff);

            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .sub-title {
            font-size: 15px;
            color: rgba(200, 190, 255, 0.6);
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }
        .file-info {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .file-info .label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(160, 150, 220, 0.6);
        }
        .file-info .name {
            font-size: 20px;
            font-weight: 600;
            color: #f0ecff;
            margin-top: 4px;
            word-break: break-all;
        }
        .file-info .size {
            font-size: 13px;
            color: rgba(180, 170, 230, 0.5);
            margin-top: 6px;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, #7c5cfc, #b45aff);
            border: none;

            font-size: 20px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(124, 92, 252, 0.45);
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(124, 92, 252, 0.65);
            background: linear-gradient(135deg, #8f6eff, #c76aff);
        }
        .btn-download:active {
            transform: scale(0.96);
        }
        .btn-download i {
            font-size: 26px;
            line-height: 1;
        }
        .btn-copy {
            margin-top: 16px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 18px;
            border-radius: 40px;
            color: rgba(200, 190, 255, 0.5);
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);

        .btn-copy:hover {

        }
        @media (max-width: 420px) {
            .card { padding: 28px 18px; border-radius: 32px; }
            h1 { font-size: 26px; }
            .btn-download { font-size: 17px; padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">🎮</div>
        <h1>MODSKIN</h1>
        <div class="sub-title">⚡ Dark Mode · Direct Link </div>
        <div class="file-info">
            <div class="label">📦 package name</div>
            <div class="name">MODSKIN 💩🥀🙏👍🐧</div>
            <div class="size">🔗 MediaFire · ZIP</div>
        </div>
        <a href="https://www.mediafire.com/file/rom2dvrainpwiay/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7.zip/file" 
           class="btn-download" 
           target="_blank" 
           rel="noopener noreferrer">
            ⬇️ Tải xuống ngay
        </a>
        <div class="btn-copy" id="copyBtn">📋 copy </div>
        <div class="footer">GitHub dodat tone</div>
    </div>
    <script>
        (function() {
            const btn = document.getElementById('copyBtn');
            const url = 'https://www.mediafire.com/file/rom2dvrainpwiay/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7.zip/file';
            btn.addEventListener('click', function() {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(function() {
                        const old = btn.innerText;
                        btn.innerText = '✅ copied!';
                        btn.style.color = '#a78aff';
                        setTimeout(function() {
                            btn.innerText = old;
                            btn.style.color = '';
                        }, 2000);
                    }).catch(function() { fallback(url); });
                } else { fallback(url); }
            });
            function fallback(t) {
                const e = document.createElement('input');
                e.value = t;
                document.body.appendChild(e);
                e.select();
                try {
                    document.execCommand('copy');
                    const old = btn.innerText;
                    btn.innerText = '✅ copied!';
                    btn.style.color = '#a78aff';
                    setTimeout(function() {
                        btn.innerText = old;
                        btn.style.color = '';
                    }, 2000);
                } catch (x) { alert('copy'); }
                document.body.removeChild(e);
            }
        })();
    </script>
</body>
