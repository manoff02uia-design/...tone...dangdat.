<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringo XP GetKey Auto</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; }
        #frame-container { position: relative; width: 100%; height: 80vh; border: 2px solid #00ff00; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-red { background: #ff3333; color: #fff; }
        .btn-green { background: #00ff00; color: #000; }
        #status { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h2>GRINGO XP GETKEY</h2>
    
    <div id="frame-container">
        <iframe id="targetFrame" src="https://gringoxp.site/gringo/GetKey" allow="clipboard-write"></iframe>
    </div>

    <button class="btn btn-red" onclick="openInNewTab()">MỞ TRONG TAB MỚI</button>
    <button class="btn btn-green" onclick="forceRedirect()">CHUYỂN HƯỚNG NGAY</button>

    <div id="status">Đang kiểm tra kết nối...</div>

    <script>
        const iframe = document.getElementById('targetFrame');
        const statusDiv = document.getElementById('status');
        
        function openInNewTab() {
            window.open('https://gringoxp.site/gringo/GetKey', '_blank');
        }

        function forceRedirect() {
            window.location.href = 'https://example.com'; 
        }

        setTimeout(() => {
            try {
                const doc = iframe.contentWindow.document;
                if (doc.body.innerHTML === '') {
                    statusDiv.innerText = 'Iframe trống hoặc bị chặn. Bấm nút đỏ.';
                } else {
                    statusDiv.innerText = 'Iframe đã tải thành công.';
                }
            } catch (e) {
                statusDiv.innerText = 'Bị chặn bởi X-Frame-Options. Bấm nút đỏ để mở.';
            }
        }, 3000);
    </script>

</body>
</html>
