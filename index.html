<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loudspeaker x100</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .hidden {
            display: none !important;
        }
        .box {
            width: 250px;
            height: 150px;
            border: 2px solid #00ff00;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            transition: all 0.3s ease;
            background: #111;
            user-select: none;
            margin-bottom: 20px;
        }
        .box:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
        }
        .box:active {
            transform: scale(0.95);
        }
        .btn-download {
            padding: 15px 30px;
            background: #000;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.3s;
            font-family: 'Courier New', Courier, monospace;
        }
        .btn-download:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }
        #status {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
        .playing {
            border-color: #ff00ff !important;
            box-shadow: 0 0 20px #ff00ff !important;
            color: #ff00ff !important;
        }
        .playing:hover {
            background: #ff00ff !important;
            color: #000 !important;
        }
    </style>
</head>
<body>

    <div id="initialBox" class="box">x 100 MP4</div>
    <input type="file" id="fileInput" accept="audio/*,video/mp4" class="hidden">

    <div id="resultBox" class="box hidden">Play x 100 MP4</div>
    
    <button id="downloadBtn" class="btn-download hidden">DOWNLOAD MP4</button>

    <div id="status">Waiting for input...</div>

    <script>
        const initialBox = document.getElementById('initialBox');
        const resultBox = document.getElementById('resultBox');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');

        let audioCtx = null;
        let processedBuffer = null;
        let sourceNode = null;

        initialBox.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = `Analyzing file: ${file.name}...`;
            initialBox.style.pointerEvents = 'none';
            initialBox.style.opacity = '0.5';

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const arrayBuffer = await file.arrayBuffer();
                const originalBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const data = originalBuffer.getChannelData(0);
                let hasSound = false;

                for (let i = 0; i < data.length; i++) {
                    if (Math.abs(data[i]) > 0.01) {
                        hasSound = true;
                        break;
                    }
                }

                if (!hasSound) {
                    statusDiv.innerText = "Error: File is silent or has no sound.";
                    initialBox.style.pointerEvents = 'auto';
                    initialBox.style.opacity = '1';
                    return;
                }

                statusDiv.innerText = "Sound detected! Generating x100 version...";

                const numChannels = originalBuffer.numberOfChannels;
                const sampleRate = originalBuffer.sampleRate;
                const newLength = originalBuffer.length * 100;

                processedBuffer = audioCtx.createBuffer(numChannels, newLength, sampleRate);

                for (let channel = 0; channel < numChannels; channel++) {
                    const originalData = originalBuffer.getChannelData(channel);
                    const newData = processedBuffer.getChannelData(channel);
                    
                    for (let i = 0; i < 100; i++) {
                        newData.set(originalData, i * originalData.length);
                    }
                }

                initialBox.classList.add('hidden');
                resultBox.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
                statusDiv.innerText = "Ready. Click the box to play or download the MP4.";

            } catch (error) {
                statusDiv.innerText = "Error decoding file. Make sure it's a valid MP4 or audio file.";
                initialBox.style.pointerEvents = 'auto';
                initialBox.style.opacity = '1';
            }
        });

        resultBox.addEventListener('click', () => {
            if (!processedBuffer) return;

            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
                sourceNode = null;
                resultBox.classList.remove('playing');
                resultBox.innerText = "Play x 100 MP4";
                statusDiv.innerText = "Stopped.";
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = processedBuffer;
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 1.0;

            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            sourceNode.start();
            
            resultBox.classList.add('playing');
            resultBox.innerText = "Stop Audio";
            statusDiv.innerText = "Playing x100 audio data...";

            sourceNode.onended = () => {
                sourceNode = null;
                resultBox.classList.remove('playing');
                resultBox.innerText = "Play x 100 MP4";
                statusDiv.innerText = "Playback finished.";
            };
        });

        downloadBtn.addEventListener('click', () => {
            if (!processedBuffer) return;
            
            const wavBlob = bufferToWav(processedBuffer);
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'loudspeaker_x100.mp4';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        function bufferToWav(buffer) {
            let numOfChan = buffer.numberOfChannels,
                length = buffer.length * numOfChan * 2 + 44,
                bufferArray = new ArrayBuffer(length),
                view = new DataView(bufferArray),
                channels = [],
                sampleRate = buffer.sampleRate,
                offset = 0,
                pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952);
            setUint32(length - 8);
            setUint32(0x45564157);
            setUint32(0x20746d66);
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(sampleRate);
            setUint32(sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++)
                channels.push(buffer.getChannelData(i));

            while(pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([bufferArray], { type: "audio/mp4" });
        }
    </script>
</body>
</html>
