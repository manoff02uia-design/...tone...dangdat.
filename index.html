<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODSKIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #0d0d1a, #03030a);
            padding: 20px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(20, 22, 40, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 40px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04) inset;
            text-align: center;
            transition: transform 0.25s ease;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }
        .card:hover { transform: scale(1.01); }
        .lang-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(200,190,255,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }
        .lang-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .icon-box {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            background: linear-gradient(145deg, #ff6b9d, #c44dff, #6f8cff);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: 0 16px 32px rgba(196,77,255,0.35);
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #c8b6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 24px;
        }
        .file-block {
            background: rgba(0,0,0,0.35);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .file-block .label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(160,150,220,0.6);
        }
        .file-block .name {
            font-size: 20px;
            font-weight: 600;
            color: #f0ecff;
            margin-top: 4px;
            word-break: break-all;
        }
        .file-block .size {
            font-size: 13px;
            color: rgba(180,170,230,0.5);
            margin-top: 6px;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, #7c5cfc, #b45aff);
            border: none;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(124,92,252,0.45);
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(124,92,252,0.65);
            background: linear-gradient(135deg, #8f6eff, #c76aff);
        }
        .btn-download:active { transform: scale(0.96); }
        .btn-copy {
            margin-top: 12px;
            display: inline-block;
            background: rgba(255,255,255,0.04);
            padding: 12px 18px;
            border-radius: 40px;
            color: rgba(200,190,255,0.5);
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn-copy:hover {
            background: rgba(255,255,255,0.08);
            color: #b8acff;
        }
        @media (max-width: 420px) {
            .card { padding: 28px 18px; border-radius: 32px; }
            h1 { font-size: 26px; }
            .btn-download { font-size: 17px; padding: 15px 20px; }
        }
    </style>
</head>
<body>
<div class="card">
    <button class="lang-btn" id="langBtn">English</button>
    <div class="icon-box">🎮</div>
    <h1 id="title">MODSKIN</h1>

    <div class="file-block">
        <div class="label" id="label1">📦 Tên gói</div>
        <div class="name" id="name1">MODSKIN</div>
        <div class="size" id="size1">🔗 MediaFire · ZIP</div>
    </div>
    <a href="https://www.mediafire.com/file/3ewb4rriu012zfh/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7%25282%2529.zip/file" 
       class="btn-download" id="btn1" target="_blank" rel="noopener noreferrer">
        ⬇️ Tải xuống ngay
    </a>
    <div class="btn-copy" id="copy1">📋 Sao chép đường dẫn tải</div>

</div>
<script>
    (function() {
        var langData = {
            label1: { vi: '📦 Tên gói', en: '📦 Package name' },
            name1:  { vi: 'MODSKIN', en: 'MODSKIN' },
            size1:  { vi: '🔗 MediaFire · ZIP', en: '🔗 MediaFire · ZIP' },
            btn1:   { vi: '⬇️ Tải xuống ngay', en: '⬇️ Download now' },
            copy1:  { vi: '📋 Sao chép đường dẫn tải', en: '📋 Copy download link' },
            toggle: { vi: 'English', en: 'Tiếng Việt' }
        };
        var el = {
            label1: document.getElementById('label1'),
            name1:  document.getElementById('name1'),
            size1:  document.getElementById('size1'),
            btn1:   document.getElementById('btn1'),
            copy1:  document.getElementById('copy1'),
            langBtn: document.getElementById('langBtn')
        };
        var currentLang = 'vi';
        function setLanguage(lang) {
            currentLang = lang;
            for (var key in langData) {
                if (key === 'toggle') continue;
                if (el[key]) el[key].innerText = langData[key][lang];
            }
            el.langBtn.innerText = langData.toggle[lang];
        }
        el.langBtn.addEventListener('click', function() {
            setLanguage(currentLang === 'vi' ? 'en' : 'vi');
        });
        setLanguage('vi');

        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopied(btn);
                }).catch(function() { fallback(text, btn); });
            } else { fallback(text, btn); }
        }
        function fallback(text, btn) {
            var e = document.createElement('input');
            e.value = text;
            document.body.appendChild(e);
            e.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (x) { alert('Sao chép thủ công'); }
            document.body.removeChild(e);
        }
        function showCopied(btn) {
            var old = btn.innerText;
            btn.innerText = '✅ Đã sao chép!';
            btn.style.color = '#a78aff';
            setTimeout(function() {
                btn.innerText = old;
                btn.style.color = '';
            }, 2000);
        }
        var url1 = 'https://www.mediafire.com/file/3ewb4rriu012zfh/MODSKIN%25F0%259F%2592%25A9%25F0%259F%25A5%2580%25F0%259F%2599%258F%25F0%259F%2591%258D%25F0%259F%2590%25A7%25282%2529.zip/file';
        document.getElementById('copy1').addEventListener('click', function() { copyText(url1, this); });
    })();
</script>
</body>
</html>
