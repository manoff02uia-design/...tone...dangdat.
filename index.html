
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRU Web</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial}
header{height:52px;display:flex;align-items:center;gap:8px;padding:8px;background:#151515}
button{background:#292929;color:white;border:0;border-radius:6px;padding:9px 13px}
input{flex:1;width:50px;padding:10px;border:1px solid #444;border-radius:6px;background:#080808;color:white}
iframe{width:100%;height:calc(100dvh - 52px);border:0;background:white}
</style>
</head>
<body>
<header>
<button onclick="back()">←</button>
<input id="url" value="https://gringoxp.site/gringo/GetKey">
<button onclick="openPage()">Go</button>
</header>
<iframe id="page" title="Web" src="https://gringoxp.site/gringo/GetKey"></iframe>
<script>
const page=document.getElementById("page");
const url=document.getElementById("url");
const historyList=[];
let index=-1;

function openPage(){
let address=url.value.trim();
if(!/^https?:\/\//i.test(address)) address="https://"+address;
try{
const parsed=new URL(address);
if(!["http:","https:"].includes(parsed.protocol))return;
address=parsed.href;
historyList.splice(index+1);
historyList.push(address);
index=historyList.length-1;
url.value=address;
page.src=address;
}catch{
alert("Invalid URL");
}
}

function back(){
if(index>0){
index--;
url.value=historyList[index];
page.src=historyList[index];
}
}

page.addEventListener("load",()=>{
try{url.value=page.contentWindow.location.href}catch{}
});

historyList.push(url.value);
index=0;
</script>
</body>
</html>
